[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "household-power"
version = "1.0.0"
description = "Next-Hour Household Active Power Forecasting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "joblib>=1.3.0",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
serving = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.1"]
